<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Embakasi Providers Directory</title>

<style>

body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}

header{
background:black;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
color:#ff2e63;
}

.banner{
background:#ff2e63;
padding:20px;
text-align:center;
font-size:18px;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

.providers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:#222;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card h3{
margin:0;
color:#ff2e63;
}

.whatsapp{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:5px;
}

.register{
background:#ff2e63;
padding:10px 20px;
color:white;
text-decoration:none;
border-radius:6px;
}

footer{
background:black;
text-align:center;
padding:15px;
margin-top:40px;
}

</style>

</head>

<body>

<header>

<h1>Embakasi Directory</h1>

<a class="register"
href="https://docs.google.com/forms/d/e/1FAIpQLScT-eJVOlztP5TN2sx5rhgnHUwkpx1ZnwUqZ5_fFXSYWYmHTw/viewform"
target="_blank">
Register
</a>

</header>

<div class="banner">
Independent Providers — Register to get listed
</div>

<div class="container">

<h2>Available Providers</h2>

<div id="providersList" class="providers">
Loading providers...
</div>

</div>

<footer>

Disclaimer: This platform only lists independent providers.  
All providers are responsible for their own services.

</footer>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR0H7vZaxYZCGNOzbekdzsMJbRwehJ4JK8aCTeGdD8IyaKA1uSz1cMhi8La9OhIon2ZWFFfQN8UzeNe/pub?gid=1626780563&single=true&output=csv";

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

let rows=data.split("\n").slice(1);
let html="";

rows.forEach(row=>{

let cols=row.split(",");

let name=cols[1];
let age=cols[2];
let location=cols[3];
let phone=cols[4];
let photo=cols[7]; // Upload Profile Photo column
let description=cols[8];

if(name){

html+=`

<div class="card">

<img src="${photo}" alt="${name}">

<div class="card-content">

<h3>${name}</h3>

<p>Age: ${age}</p>

<p>Location: ${location}</p>

<p>${description}</p>

<a class="whatsapp" href="https://wa.me/${phone}" target="_blank">
WhatsApp
</a>

</div>

</div>

`;

}

});

document.getElementById("providersList").innerHTML=html;

});

</script>

</body>
</html>
