<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Embakasi Providers Directory</title>

<style>

body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}

header{
background:black;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
color:#ff2e63;
margin:0;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:bold;
}

.banner{
background:#ff2e63;
text-align:center;
padding:20px;
}

.search{
text-align:center;
margin:20px;
}

.search input{
padding:10px;
width:250px;
border-radius:5px;
border:none;
}

.search select{
padding:10px;
border-radius:5px;
border:none;
}

.directory{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
padding:20px;
}

.card{
background:#222;
width:260px;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card-content h3{
color:#ff2e63;
margin:5px 0;
}

.whatsapp{
display:block;
background:#25D366;
padding:10px;
text-align:center;
margin-top:10px;
color:white;
text-decoration:none;
border-radius:5px;
}

footer{
background:black;
text-align:center;
padding:20px;
margin-top:40px;
}

.contact{
padding:40px;
text-align:center;
}

.contact a{
color:#25D366;
font-size:18px;
text-decoration:none;
}

</style>

</head>

<body>

<header>

<h1>Embakasi escorts and extras</h1>

<nav>

<a href="index.html">Home</a>
<a href="register.html">Register</a>
<a href="#contact">Contact</a>

</nav>

</header>

<div class="banner">

Independent Service Providers  
Register to appear in the directory

</div>

<div class="search">

<input type="text" id="searchInput" placeholder="Search by name">

<select id="locationFilter">

<option value="">All Locations</option>
<option>Embakasi</option>
<option>Utawala</option>
<option>Tassia</option>
<option>Pipeline</option>
<option>Fedha</option>

</select>

</div>

<div id="directory" class="directory"></div>

<div id="contact" class="contact">

<h2>Contact Us</h2>

<p>For listings or support contact us:</p>

<p>
<a href="https://wa.me/254705283274">WhatsApp 0705283274</a>
</p>

<p>Email: wanyonyibyram95@gmail.com</p>

</div>

<footer>

<p>
Disclaimer: This website only lists independent providers.
Users must be 18+.
</p>

</footer>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR0H7vZaxYZCGNOzbekdzsMJbRwehJ4JK8aCTeGdD8IyaKA1uSz1cMhi8La9OhIon2ZWFFfQN8UzeNe/pub?gid=1626780563&single=true&output=csv";

let providers=[];

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

let rows=data.split("\n").slice(1);

rows.forEach(row=>{

let cols=row.split(",");

let provider={
name:cols[1],
age:cols[2],
location:cols[3],
phone:cols[4],
photo:cols[7]
};

if(provider.name){
providers.push(provider);
}

});

displayProviders(providers);

});

function displayProviders(list){

let html="";

list.forEach(p=>{

html+=`

<div class="card">

<img src="${p.photo}" onerror="this.src='https://via.placeholder.com/260x260'">

<div class="card-content">

<h3>${p.name}</h3>

<p>Age: ${p.age}</p>

<p>Location: ${p.location}</p>

<a class="whatsapp" href="https://wa.me/${p.phone}" target="_blank">
WhatsApp
</a>

</div>

</div>

`;

});

document.getElementById("directory").innerHTML=html;

}

document.getElementById("searchInput").addEventListener("keyup",function(){

let keyword=this.value.toLowerCase();

let filtered=providers.filter(p=>p.name.toLowerCase().includes(keyword));

displayProviders(filtered);

});

document.getElementById("locationFilter").addEventListener("change",function(){

let loc=this.value.toLowerCase();

let filtered=providers.filter(p=>p.location.toLowerCase().includes(loc));

displayProviders(filtered);

});

</script>

</body>
</html>
