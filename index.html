<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Embakasi Escorts Directory</title>

<style>

body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}

header{
background:black;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
color:#ff2e63;
}

nav a{
color:white;
margin-left:15px;
text-decoration:none;
font-weight:bold;
}

.banner{
background:#ff2e63;
padding:20px;
text-align:center;
font-size:18px;
}

.container{
max-width:1000px;
margin:auto;
padding:30px;
}

.providers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#222;
padding:20px;
border-radius:10px;
}

.card h3{
margin-top:0;
color:#ff2e63;
}

.whatsapp{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:5px;
}

.register{
display:inline-block;
background:#ff2e63;
color:white;
padding:12px 20px;
text-decoration:none;
border-radius:5px;
margin-top:10px;
}

footer{
background:black;
padding:15px;
text-align:center;
margin-top:40px;
font-size:14px;
}

</style>

</head>

<body>

<header>

<h1>Embakasi Directory</h1>

<nav>
<a href="#providers">Providers</a>
<a href="https://docs.google.com/forms/d/e/1FAIpQLScT-eJVOlztP5TN2sx5rhgnHUwkpx1ZnwUqZ5_fFXSYWYmHTw/viewform" target="_blank">Register</a>
</nav>

</header>

<div class="banner">
Independent Providers Directory <br>
<a class="register" href="https://docs.google.com/forms/d/e/1FAIpQLScT-eJVOlztP5TN2sx5rhgnHUwkpx1ZnwUqZ5_fFXSYWYmHTw/viewform" target="_blank">Register Now</a>
</div>

<div class="container">

<h2 id="providers">Available Providers</h2>

<div class="providers" id="providersList">
Loading providers...
</div>

</div>

<footer>

<p>
Disclaimer: This website only lists independent providers.  
All providers are responsible for their own services.
</p>

</footer>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR0H7vZaxYZCGNOzbekdzsMJbRwehJ4JK8aCTeGdD8IyaKA1uSz1cMhi8La9OhIon2ZWFFfQN8UzeNe/pub?gid=1626780563&single=true&output=csv";

fetch(sheetURL)
.then(response => response.text())
.then(data => {

let rows = data.split("\n").slice(1);

let html = "";

rows.forEach(row => {

let cols = row.split(",");

let name = cols[1];
let age = cols[2];
let location = cols[3];
let phone = cols[4];

if(name){

html += `
<div class="card">

<h3>${name}</h3>

<p><b>Age:</b> ${age}</p>

<p><b>Location:</b> ${location}</p>

<a class="whatsapp" href="https://wa.me/${phone}" target="_blank">
WhatsApp
</a>

</div>
`;

}

});

document.getElementById("providersList").innerHTML = html;

});

</script>

</body>
</html>
