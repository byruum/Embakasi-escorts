<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Embakasi escorts and extra </title>

<style>

body{
font-family:Arial;
margin:0;
background:#111;
color:white;
}

header{
background:black;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
margin:0;
color:#ff2e63;
}

.register{
background:#ff2e63;
padding:10px 20px;
color:white;
text-decoration:none;
border-radius:6px;
}

.banner{
background:#ff2e63;
padding:20px;
text-align:center;
font-size:18px;
}

.container{
max-width:1200px;
margin:auto;
padding:30px;
}

.search{
margin-bottom:30px;
text-align:center;
}

.search input{
padding:12px;
width:300px;
border-radius:6px;
border:none;
}

.providers{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:#222;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:260px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card h3{
margin:0;
color:#ff2e63;
}

.vip{
background:gold;
color:black;
padding:3px 8px;
font-size:12px;
border-radius:4px;
margin-left:6px;
}

.whatsapp{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:5px;
}

footer{
background:black;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

</head>

<body>

<header>

<h1>Embakasi Directory</h1>

<a class="register"
href="https://docs.google.com/forms/d/e/1FAIpQLScT-eJVOlztP5TN2sx5rhgnHUwkpx1ZnwUqZ5_fFXSYWYmHTw/viewform"
target="_blank">
Register
</a>

</header>

<div class="banner">
Independent Providers — Register to get listed
</div>

<div class="container">

<div class="search">
<input type="text" id="searchInput" placeholder="Search location...">
</div>

<div id="providersList" class="providers">
Loading providers...
</div>

</div>

<footer>

Disclaimer: This platform only lists independent providers.  
All providers are responsible for their own services.

</footer>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR0H7vZaxYZCGNOzbekdzsMJbRwehJ4JK8aCTeGdD8IyaKA1uSz1cMhi8La9OhIon2ZWFFfQN8UzeNe/pub?gid=1626780563&single=true&output=csv";

let providers=[];

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{

let rows=data.split("\n").slice(1);

rows.forEach(row=>{

let cols=row.split(",");

let provider={
name:cols[1],
age:cols[2],
location:cols[3],
phone:cols[4],
photo:cols[7],
description:cols[8]
};

if(provider.name){
providers.push(provider);
}

});

displayProviders(providers);

});

function displayProviders(list){

let html="";

list.forEach(p=>{

html+=`

<div class="card">

<img src="${p.photo}" alt="${p.name}">

<div class="card-content">

<h3>${p.name}</h3>

<p>Age: ${p.age}</p>

<p>Location: ${p.location}</p>

<p>${p.description}</p>

<a class="whatsapp" href="https://wa.me/${p.phone}" target="_blank">
Chat on WhatsApp
</a>

</div>

</div>

`;

});

document.getElementById("providersList").innerHTML=html;

}

document.getElementById("searchInput").addEventListener("keyup",function(){

let keyword=this.value.toLowerCase();

let filtered=providers.filter(p=>p.location.toLowerCase().includes(keyword));

displayProviders(filtered);

});

</script>

</body>

</html>
